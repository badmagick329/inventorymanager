services:
  db:
    image: postgres:15
    volumes:
      - ./db:/var/lib/postgresql/data/
    environment:
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
      POSTGRES_USER: "${DB_USER}"
      POSTGRES_DB: "${DB_NAME}"
    restart: "on-failure"
    ports:
      - "${DB_PORT}:5432"
  db_test:
    image: postgres:15
    volumes:
      - ./db_test:/var/lib/postgresql/data/
    environment:
      POSTGRES_PASSWORD: "${DB_TEST_PASSWORD}"
      POSTGRES_USER: "${DB_TEST_USER}"
      POSTGRES_DB: "${DB_TEST_NAME}"
    restart: "on-failure"
    ports:
      - "${DB_TEST_PORT}:5432"
