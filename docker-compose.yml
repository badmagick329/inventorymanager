services:
  db:
    image: postgres:15
    volumes:
      - ./db:/var/lib/postgresql/data/
    restart: "on-failure"
    environment:
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
      POSTGRES_USER: "${DB_USER}"
      POSTGRES_DB: "${DB_NAME}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
  backend:
    image: inventorymanager_backend:prod
    restart: "always"
    environment:
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-6-luna}"
      OPENAI_REASONING_EFFORT: "${OPENAI_REASONING_EFFORT:-high}"
      OPENAI_COST_GPT_6_LUNA_INPUT_PER_MILLION: "${OPENAI_COST_GPT_6_LUNA_INPUT_PER_MILLION:-0.10}"
      OPENAI_COST_GPT_6_LUNA_CACHED_INPUT_PER_MILLION: "${OPENAI_COST_GPT_6_LUNA_CACHED_INPUT_PER_MILLION:-0.01}"
      OPENAI_COST_GPT_6_LUNA_OUTPUT_PER_MILLION: "${OPENAI_COST_GPT_6_LUNA_OUTPUT_PER_MILLION:-0.50}"
      OPENAI_COST_GPT_5_6_LUNA_INPUT_PER_MILLION: "${OPENAI_COST_GPT_5_6_LUNA_INPUT_PER_MILLION:-0.20}"
      OPENAI_COST_GPT_5_6_LUNA_CACHED_INPUT_PER_MILLION: "${OPENAI_COST_GPT_5_6_LUNA_CACHED_INPUT_PER_MILLION:-0.02}"
      OPENAI_COST_GPT_5_6_LUNA_OUTPUT_PER_MILLION: "${OPENAI_COST_GPT_5_6_LUNA_OUTPUT_PER_MILLION:-1.20}"
      OPENAI_COST_GPT_5_6_TERRA_INPUT_PER_MILLION: "${OPENAI_COST_GPT_5_6_TERRA_INPUT_PER_MILLION:-2.00}"
      OPENAI_COST_GPT_5_6_TERRA_CACHED_INPUT_PER_MILLION: "${OPENAI_COST_GPT_5_6_TERRA_CACHED_INPUT_PER_MILLION:-0.20}"
      OPENAI_COST_GPT_5_6_TERRA_OUTPUT_PER_MILLION: "${OPENAI_COST_GPT_5_6_TERRA_OUTPUT_PER_MILLION:-12.00}"
      OPENAI_COST_GPT_5_6_SOL_INPUT_PER_MILLION: "${OPENAI_COST_GPT_5_6_SOL_INPUT_PER_MILLION:-5.00}"
      OPENAI_COST_GPT_5_6_SOL_CACHED_INPUT_PER_MILLION: "${OPENAI_COST_GPT_5_6_SOL_CACHED_INPUT_PER_MILLION:-0.50}"
      OPENAI_COST_GPT_5_6_SOL_OUTPUT_PER_MILLION: "${OPENAI_COST_GPT_5_6_SOL_OUTPUT_PER_MILLION:-30.00}"
    command: sh -c "python3 manage.py migrate &&
      python3 manage.py collectstatic --no-input &&
      gunicorn backend.wsgi:application --bind 0.0.0.0:${DJANGO_PORT}"
    volumes:
      - staticfiles:/usr/src/app/staticfiles
    expose:
      - ${DJANGO_PORT}
    depends_on:
      db:
        condition: service_healthy
  nextapp:
    image: inventorymanager_frontend:prod
    restart: "unless-stopped"
    depends_on:
      - backend

  nginx:
    build:
      context: ./nginx
    restart: "always"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/logs/:/var/logs
      - staticfiles:/usr/src/app/staticfiles
    ports:
      - ${NGINX_PORT}:${NGINX_PORT}
    depends_on:
      - backend

volumes:
  staticfiles:
